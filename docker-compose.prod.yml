name: recon

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recon}
      POSTGRES_DB: ${POSTGRES_DB:-recon}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-recon}:${POSTGRES_PASSWORD:-recon}@db:5432/${POSTGRES_DB:-recon}
      WATCHFILES_FORCE_POLLING: "true" # auto-reload also works on Windows bind mounts
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEMO_EXEC_PASSWORD: ${DEMO_EXEC_PASSWORD:-}
      DEMO_COFOUNDER_PASSWORD: ${DEMO_COFOUNDER_PASSWORD:-}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./sample_data:/sample_data:ro # the demo data ("../sample_data/small" from /app)
    command: >
      sh -c "python -m app.migrate &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
